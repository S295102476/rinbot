name: Public release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: qq-bot-py/requirements.lock.txt
      - run: python -m pip install -r qq-bot-py/requirements.lock.txt -r qq-bot-py/requirements-dev.txt
      - name: Check public files and history
        run: python tools/check_public_release.py --history
      - name: Backend tests
        working-directory: qq-bot-py
        run: python -m pytest tests -q
      - name: Check bundled idiom data
        working-directory: qq-bot-py
        run: python tools/check_idioms.py
      - name: Compose configuration
        run: docker compose --env-file .env.example config --quiet

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qq-bot-py/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qq-bot-py/console/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml websockets
      - name: Clean deployment with mock OneBot and model
        run: python tools/compose_smoke.py
